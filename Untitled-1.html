<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキスギ爆速音声カウンター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111827;
            color: #fff;
        }

        .container {
            text-align: center;
            background: #1f2937;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 340px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #f3f4f6;
        }

        .status {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 1.5rem;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4b5563;
            margin-right: 5px;
        }

        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .counter {
            font-size: 4.5rem;
            font-weight: bold;
            color: #f59e0b;
            margin: 0.5rem 0;
            line-height: 1;
            transition: transform 0.08s ease;
        }

        /* 高速検知用アニメーション */
        .counter.bump {
            transform: scale(1.18);
            color: #fbbf24;
        }

        .last-word {
            font-size: 0.85rem;
            color: #6b7280;
            height: 2.5em;
            margin-bottom: 1.5rem;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.9rem 2rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-toggle.stop {
            background-color: #dc2626;
        }

        .btn-reset {
            margin-top: 1.2rem;
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
        }

        .btn-reset:hover {
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>イキスギ 音声カウンター</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">停止中</span>
        </div>

        <div class="counter" id="countDisplay">2345</div>
        <div class="last-word" id="lastWord">「マイク開始」を押して話してください</div>

        <button class="btn-toggle" id="toggleBtn">マイク開始</button>
        <br>
        <button class="btn-reset" id="resetBtn">カウントを 2345 にリセット</button>
    </div>

    <script>
        const countDisplay = document.getElementById('countDisplay');
        const lastWordDisplay = document.getElementById('lastWord');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // デフォルト初期値を 2345 に設定
        const DEFAULT_COUNT = 2345;
        let count = parseInt(localStorage.getItem('ikisugiHighSensCount'));
        if (isNaN(count)) {
            count = DEFAULT_COUNT;
        }
        countDisplay.textContent = count;

        let isListening = false;
        let recognition = null;
        let lastMatchedIndex = -1; // 重複判定を防ぐためのインデックス管理

        // Web Audio API の準備（爆速ピコン音）
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeepSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // 超高感度用レスポンス音
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1200, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.06);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(2400, now + 0.06);
            gain2.gain.setValueAtTime(0.4, now + 0.06);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.20);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.06);
            osc2.stop(now + 0.20);
        }

        function triggerCounterAnimation() {
            countDisplay.classList.add('bump');
            setTimeout(() => {
                countDisplay.classList.remove('bump');
            }, 80);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。Google Chrome等をご利用ください。");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true; // リアルタイム途中の超高速取得

            // 認識ロジック（感度向上）
            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    lastWordDisplay.textContent = `認識中: "${transcript}"`;

                    // 「行き過ぎ」「行過ぎ」「いきすぎ」「イキスギ」等の各種揺れに対応
                    const isMatched = /行き過ぎ|行過ぎ|いきすぎ|イキスギ|いきスギ|イキすぎ/.test(transcript);

                    if (isMatched) {
                        // この結果セットでまだカウントしていない場合に即座に加算
                        if (lastMatchedIndex !== i) {
                            lastMatchedIndex = i;

                            count++;
                            countDisplay.textContent = count;
                            localStorage.setItem('ikisugiHighSensCount', count);

                            playBeepSound();
                            triggerCounterAnimation();
                            lastWordDisplay.textContent = `超速検知: "${transcript}" (+1)`;
                        }
                    }
                }
            };

            recognition.onend = () => {
                lastMatchedIndex = -1;
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    updateUI(false);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') return;
                console.error("音声認識エラー:", event.error);
                if (event.error === 'not-allowed') {
                    alert("マイク許可が必要です。ブラウザのアドレスバー横からマイクを「許可」に固定してください。");
                    stopListening();
                }
            };
        }

        function toggleListening() {
            initAudio();
            if (!recognition) return;
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            isListening = true;
            lastMatchedIndex = -1;
            recognition.start();
            updateUI(true);
        }

        function stopListening() {
            isListening = false;
            recognition.stop();
            updateUI(false);
        }

        function updateUI(listening) {
            if (listening) {
                toggleBtn.textContent = "マイク停止";
                toggleBtn.classList.add('stop');
                statusDot.classList.add('active');
                statusText.textContent = "高感度マイクON (即時検知中)";
            } else {
                toggleBtn.textContent = "マイク開始";
                toggleBtn.classList.remove('stop');
                statusDot.classList.remove('active');
                statusText.textContent = "停止中";
            }
        }

        // リセット時は 2345 に戻す
        resetBtn.addEventListener('click', () => {
            if (confirm("カウントを 2345 にリセットしますか？")) {
                count = DEFAULT_COUNT;
                countDisplay.textContent = count;
                localStorage.setItem('ikisugiHighSensCount', count);
                lastWordDisplay.textContent = "2345 にリセットしました";
            }
        });

        toggleBtn.addEventListener('click', toggleListening);
    </script>

</body>
</html>
