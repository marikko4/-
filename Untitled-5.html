<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキスギ10万回耐久 for TikTok LIVE (ド派手・薄型横長)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Noto+Sans+JP:wght@900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* OBS透過用 */
            color: #fff;
            overflow: hidden;
        }

        /* 派手な横長カード */
        .banner-card {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 20, 32, 0.95), rgba(8, 10, 15, 0.95));
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            width: 740px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            /* 枠線のパルス発光アニメーション */
            animation: border-pulse 1.5s infinite alternate;
            overflow: visible;
        }

        @keyframes border-pulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1); }
            100% { box-shadow: 0 0 35px rgba(0, 240, 255, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.5); border-color: #ff007f; }
        }

        /* IDバッジ (激しいネオン) */
        .id-badge {
            position: absolute;
            top: -14px;
            left: 20px;
            background: linear-gradient(135deg, #ff0055, #ff5000);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 3px 12px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.9);
            letter-spacing: 1px;
            animation: badge-pulse 2s infinite alternate;
        }

        @keyframes badge-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* 左ブロック：企画タイトル ＆ 進捗バー */
        .left-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1.2;
        }

        /* 流れるグラデーションテキスト */
        .challenge-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            white-space: nowrap;
        }

        .challenge-title span {
            background: linear-gradient(90deg, #00f0ff, #ff007f, #ffea00, #00f0ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-shine 3s linear infinite;
        }

        @keyframes text-shine {
            to { background-position: 300% center; }
        }

        /* ド派手プログレスバー（動く斜めストライプ） */
        .progress-box {
            width: 100%;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #cbd5e0;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 14px;
            background: #111827;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.5);
            box-shadow: inset 0 0 5px #000;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            /* サイバーパンクな斜めストライプ */
            background: repeating-linear-gradient(
                45deg,
                #ff007f,
                #ff007f 10px,
                #00f0ff 10px,
                #00f0ff 20px
            );
            background-size: 28px 28px;
            box-shadow: 0 0 15px #ff007f;
            animation: move-stripes 0.8s linear infinite;
            transition: width 0.3s ease;
        }

        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }

        /* 中央ブロック：カウンターメイン数値 */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            border-left: 2px dashed rgba(0, 240, 255, 0.3);
            border-right: 2px dashed rgba(0, 240, 255, 0.3);
        }

        /* カウンター本体（通常時も少し脈打つ） */
        .counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff007f;
            line-height: 0.9;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ★検知時の激しいアクション★ */
        .counter.bump {
            transform: scale(1.35) rotate(-3deg); /* 大きく拡大＋少し傾く */
            color: #fff; /* 真っ白にフラッシュ */
            text-shadow: 0 0 25px #fff, 0 0 50px #00f0ff, 0 0 80px #ff007f;
        }

        .goal-subtext {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #fff;
            margin-top: 6px;
            text-shadow: 0 0 8px #ff007f;
        }

        .goal-subtext span {
            color: #ffea00;
            font-weight: bold;
        }

        /* 右ブロック：フォロー目標 ＆ 操作 */
        .right-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 0.9;
        }

        .follower-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px #00f0ff solid;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .goal-inputs {
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: 'Orbitron', sans-serif;
            color: #ff007f;
        }

        .goal-inputs input {
            width: 45px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #ff007f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            text-align: center;
            outline: none;
            text-shadow: 0 0 5px #ff007f;
        }

        /* 操作コントロール */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-toggle {
            font-size: 0.8rem;
            font-weight: bold;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            flex: 1;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-toggle:active {
            transform: scale(0.95);
        }

        .btn-toggle.stop {
            background: linear-gradient(135deg, #ff0055, #ffea00);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: #cbd5e0;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-size: 0.7rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status-bar {
            font-size: 0.7rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4a5568;
            flex-shrink: 0;
        }

        /* 録音中のドットは激しく点滅 */
        .status-dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 10px #00ff66;
            animation: dot-blink 0.5s infinite alternate;
        }

        @keyframes dot-blink {
            0% { opacity: 1; box-shadow: 0 0 15px #00ff66; }
            100% { opacity: 0.3; box-shadow: 0 0 2px #00ff66; }
        }
    </style>
</head>
<body>

    <div class="banner-card">
        <!-- IDバッジ -->
        <div class="id-badge">ID: dswiikou</div>

        <!-- 左：企画タイトル＆プログレス -->
        <div class="left-block">
            <h1 class="challenge-title">🔥 <span>イキスギ 10万回耐久</span> 🔥</h1>
            <div class="progress-box">
                <div class="progress-info">
                    <span>達成度 (OVERRIDE)</span>
                    <span id="challengePercent">7.15%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="challengeProgressBar"></div>
                </div>
            </div>
        </div>

        <!-- 中央：メインカウンター -->
        <div class="center-block">
            <div class="counter" id="countDisplay">7152</div>
            <div class="goal-subtext">GOAL: <span>100,000</span></div>
        </div>

        <!-- 右：フォロー目標＆コントロール -->
        <div class="right-block">
            <div class="follower-box">
                <span style="color:#00f0ff; font-weight:bold;">🎯 フォロワー</span>
                <div class="goal-inputs">
                    <input type="number" id="currentFollowers" value="850"> / 
                    <input type="number" id="targetFollowers" value="1000">
                </div>
            </div>

            <div class="controls">
                <button class="btn-toggle" id="toggleBtn">マイク開始</button>
                <button class="btn-reset" id="resetBtn">リセット</button>
            </div>

            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span id="lastWord">マイク停止中...</span>
            </div>
        </div>
    </div>

    <script>
        const countDisplay = document.getElementById('countDisplay');
        const lastWordDisplay = document.getElementById('lastWord');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDot = document.getElementById('statusDot');

        const challengeProgressBar = document.getElementById('challengeProgressBar');
        const challengePercent = document.getElementById('challengePercent');

        const currentFollowersInput = document.getElementById('currentFollowers');
        const targetFollowersInput = document.getElementById('targetFollowers');

        const DEFAULT_COUNT = 7152;
        const GOAL_COUNT = 100000;

        let count = parseInt(localStorage.getItem('ikisugiFlashyCount'));
        if (isNaN(count)) {
            count = DEFAULT_COUNT;
        }

        // 進捗更新
        function updateChallengeProgress() {
            countDisplay.textContent = count;
            const percent = ((count / GOAL_COUNT) * 100).toFixed(2);
            challengePercent.textContent = percent + '%';
            challengeProgressBar.style.width = Math.min(percent, 100) + '%';
            localStorage.setItem('ikisugiFlashyCount', count);
        }

        updateChallengeProgress();

        // フォロー目標の保存
        if(localStorage.getItem('followerCurrentFL')) {
            currentFollowersInput.value = localStorage.getItem('followerCurrentFL');
        }
        if(localStorage.getItem('followerTargetFL')) {
            targetFollowersInput.value = localStorage.getItem('followerTargetFL');
        }

        currentFollowersInput.addEventListener('input', () => {
            localStorage.setItem('followerCurrentFL', currentFollowersInput.value);
        });
        targetFollowersInput.addEventListener('input', () => {
            localStorage.setItem('followerTargetFL', targetFollowersInput.value);
        });

        let isListening = false;
        let recognition = null;
        let countedMap = {};
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 派手なビープ音（少しピッチ高め）
        function playBeepSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square'; // 派手な音質に変更
            osc1.frequency.setValueAtTime(1500, now);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(3000, now + 0.08);
            gain2.gain.setValueAtTime(0.3, now + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.20);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.20);
        }

        // ド派手なカウンターアニメーション
        function triggerCounterAnimation() {
            // アニメーションを再トリガーするために一度クラスを外す
            countDisplay.classList.remove('bump');
            void countDisplay.offsetWidth; // リフロー強制
            countDisplay.classList.add('bump');
            
            // 少し長めにアニメーションを残す
            setTimeout(() => {
                countDisplay.classList.remove('bump');
            }, 150); 
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。Google Chrome等をご利用ください。");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;

            const targetPattern = /行き過ぎ|行過ぎ|いきすぎ|イキスギ|いきスギ|イキすぎ|キスいい|キスイイ|岐阜|ぎふ|ディスイー|ディス representation|キスギ|きすぎ/gi;

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    const matches = transcript.match(targetPattern);
                    const totalMatchesInResult = matches ? matches.length : 0;
                    const alreadyCounted = countedMap[i] || 0;
                    const newMatches = totalMatchesInResult - alreadyCounted;

                    if (newMatches > 0) {
                        count += newMatches;
                        updateChallengeProgress();

                        countedMap[i] = totalMatchesInResult;

                        playBeepSound();
                        triggerCounterAnimation();
                        lastWordDisplay.innerHTML = `<span style="color:#ffea00;">⚡検知: "${transcript}"</span>`;
                    } else {
                        lastWordDisplay.textContent = `認識中: "${transcript}"`;
                    }
                }
            };

            recognition.onend = () => {
                countedMap = {};
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    updateUI(false);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') return;
                console.error("音声認識エラー:", event.error);
                if (event.error === 'not-allowed') {
                    alert("マイク許可が必要です。");
                    stopListening();
                }
            };
        }

        function toggleListening() {
            initAudio();
            if (!recognition) return;
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            isListening = true;
            countedMap = {};
            recognition.start();
            updateUI(true);
        }

        function stopListening() {
            isListening = false;
            recognition.stop();
            updateUI(false);
        }

        function updateUI(listening) {
            if (listening) {
                toggleBtn.textContent = "STOP RECORDING";
                toggleBtn.classList.add('stop');
                statusDot.classList.add('active');
                lastWordDisplay.textContent = "自動検知システム稼働中...";
            } else {
                toggleBtn.textContent = "START RECORDING";
                toggleBtn.classList.remove('stop');
                statusDot.classList.remove('active');
                lastWordDisplay.textContent = "マイク停止中";
            }
        }

        resetBtn.addEventListener('click', () => {
            if (confirm("カウントを 7152 にリセットしますか？")) {
                count = DEFAULT_COUNT;
                updateChallengeProgress();
                lastWordDisplay.textContent = "システムリセット完了";
            }
        });

        toggleBtn.addEventListener('click', toggleListening);
    </script>

</body>
</html>
