<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキスギ連続音声カウンター (効果音つき)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111827;
            color: #fff;
        }

        .container {
            text-align: center;
            background: #1f2937;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 340px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #f3f4f6;
        }

        .status {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 1.5rem;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4b5563;
            margin-right: 5px;
        }

        .status-dot.active {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .counter {
            font-size: 5.5rem;
            font-weight: bold;
            color: #f59e0b;
            margin: 0.5rem 0;
            line-height: 1;
            transition: transform 0.1s ease;
        }

        /* カウント時のアニメーション */
        .counter.bump {
            transform: scale(1.15);
            color: #fbbf24;
        }

        .last-word {
            font-size: 0.85rem;
            color: #6b7280;
            height: 2.5em;
            margin-bottom: 1.5rem;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.9rem 2rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-toggle.stop {
            background-color: #dc2626;
        }

        .btn-reset {
            margin-top: 1.2rem;
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
        }

        .btn-reset:hover {
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>イキスギ 音声カウンター</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">停止中</span>
        </div>

        <div class="counter" id="countDisplay">0</div>
        <div class="last-word" id="lastWord">「マイク開始」を押して話してください</div>

        <button class="btn-toggle" id="toggleBtn">マイク開始</button>
        <br>
        <button class="btn-reset" id="resetBtn">カウントをリセット</button>
    </div>

    <script>
        const countDisplay = document.getElementById('countDisplay');
        const lastWordDisplay = document.getElementById('lastWord');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let count = parseInt(localStorage.getItem('ikisugiFastVoiceCount')) || 0;
        countDisplay.textContent = count;

        let isListening = false;
        let recognition = null;
        let processedTextLength = 0;

        // Web Audio API のオーディオコンテキスト準備
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 「ピコン♪」効果音の生成・再生処理
        function playBeepSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            // 1音目: ピ（1046.5 Hz = C6）
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.5, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            // 2音目: コン（2093.0 Hz = C7）
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(2093.0, now + 0.08);
            gain2.gain.setValueAtTime(0.4, now + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.25);
        }

        // 数字の演出（ポンと拡大するアニメーション）
        function triggerCounterAnimation() {
            countDisplay.classList.add('bump');
            setTimeout(() => {
                countDisplay.classList.remove('bump');
            }, 120);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("お使いのブラウザは音声認識に対応していません。Google Chrome等をご利用ください。");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let currentTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        processedTextLength = 0;
                    }
                }

                lastWordDisplay.textContent = `認識中: "${currentTranscript}"`;

                const unprocessedText = currentTranscript.slice(processedTextLength);
                const targets = ["行き過ぎ", "行過ぎ", "いきすぎ", "イキスギ"];
                
                targets.forEach(target => {
                    if (unprocessedText.includes(target)) {
                        count++;
                        countDisplay.textContent = count;
                        localStorage.setItem('ikisugiFastVoiceCount', count);
                        
                        // 効果音 & アニメーション実行
                        playBeepSound();
                        triggerCounterAnimation();

                        processedTextLength = currentTranscript.length;
                        lastWordDisplay.textContent = `検知: "${target}" (+1)`;
                    }
                });
            };

            recognition.onend = () => {
                processedTextLength = 0;
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    updateUI(false);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') return;
                console.error("音声認識エラー:", event.error);
                if (event.error === 'not-allowed') {
                    alert("マイク許可が必要です。ブラウザのアドレスバー横からマイクを「許可」に固定してください。");
                    stopListening();
                }
            };
        }

        function toggleListening() {
            initAudio(); // 音声コンテキストの初期化（ブラウザ制限対策）
            if (!recognition) return;
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            isListening = true;
            processedTextLength = 0;
            recognition.start();
            updateUI(true);
        }

        function stopListening() {
            isListening = false;
            recognition.stop();
            updateUI(false);
        }

        function updateUI(listening) {
            if (listening) {
                toggleBtn.textContent = "マイク停止";
                toggleBtn.classList.add('stop');
                statusDot.classList.add('active');
                statusText.textContent = "マイクON（連続検知中…）";
            } else {
                toggleBtn.textContent = "マイク開始";
                toggleBtn.classList.remove('stop');
                statusDot.classList.remove('active');
                statusText.textContent = "停止中";
            }
        }

        resetBtn.addEventListener('click', () => {
            if (confirm("カウントをリセットしますか？")) {
                count = 0;
                countDisplay.textContent = count;
                localStorage.setItem('ikisugiFastVoiceCount', count);
                lastWordDisplay.textContent = "リセットしました";
            }
        });

        toggleBtn.addEventListener('click', toggleListening);
    </script>

</body>
</html>
