<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イキスギ10万回耐久 for TikTok LIVE (爆速応答版)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Noto+Sans+JP:wght@900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* OBS透過用 */
            color: #fff;
            gap: 20px;
        }

        /* 配信画面用バナー（枠１） */
        .banner-card {
            position: relative;
            background: linear-gradient(135deg, rgba(15, 20, 32, 0.95), rgba(8, 10, 15, 0.95));
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 0.8rem 1.5rem;
            width: 700px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            animation: border-pulse 1.5s infinite alternate;
        }

        @keyframes border-pulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1); }
            100% { box-shadow: 0 0 35px rgba(0, 240, 255, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.5); border-color: #ff007f; }
        }

        .id-badge {
            position: absolute;
            top: -14px;
            left: 20px;
            background: linear-gradient(135deg, #ff0055, #ff5000);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 3px 12px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.9);
            letter-spacing: 1px;
            animation: badge-pulse 2s infinite alternate;
        }

        @keyframes badge-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .left-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1.4;
        }

        .challenge-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            white-space: nowrap;
        }

        .challenge-title span {
            background: linear-gradient(90deg, #00f0ff, #ff007f, #ffea00, #00f0ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-shine 3s linear infinite;
        }

        @keyframes text-shine {
            to { background-position: 300% center; }
        }

        .progress-box {
            width: 100%;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #cbd5e0;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .progress-bar-bg {
            width: 100%;
            height: 14px;
            background: #111827;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.5);
            box-shadow: inset 0 0 5px #000;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(
                45deg,
                #ff007f,
                #ff007f 10px,
                #00f0ff 10px,
                #00f0ff 20px
            );
            background-size: 28px 28px;
            box-shadow: 0 0 15px #ff007f;
            animation: move-stripes 0.8s linear infinite;
            transition: width 0.3s ease;
        }

        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }

        .right-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 1.5rem;
            border-left: 2px dashed rgba(0, 240, 255, 0.3);
        }

        .counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.2rem;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff007f;
            line-height: 0.9;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .counter.bump {
            transform: scale(1.35) rotate(-3deg);
            color: #fff;
            text-shadow: 0 0 25px #fff, 0 0 50px #00f0ff, 0 0 80px #ff007f;
        }

        .goal-subtext {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #fff;
            margin-top: 6px;
            text-shadow: 0 0 8px #ff007f;
        }

        .goal-subtext span {
            color: #ffea00;
            font-weight: bold;
        }

        /* 配信者専用 操作リモコンパネル（枠２） */
        .control-panel {
            background: rgba(20, 25, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            width: 700px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 0.75rem;
            color: #a0aec0;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4a5568;
            display: inline-block;
        }

        .status-dot.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
            animation: dot-blink 0.5s infinite alternate;
        }

        @keyframes dot-blink {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .status-bar {
            font-size: 0.75rem;
            color: #cbd5e0;
            margin-top: 2px;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-toggle {
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.5rem 1.2rem;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            color: #000;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-toggle:active {
            transform: scale(0.95);
        }

        .btn-toggle.stop {
            background: linear-gradient(135deg, #ff0055, #ffea00);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: #cbd5e0;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- 1. OBS配信画面用バナー -->
    <div class="banner-card">
        <div class="id-badge">ID: dswiikou</div>

        <div class="left-block">
            <h1 class="challenge-title">🔥 <span>イキスギ 10万回耐久</span> 🔥</h1>
            <div class="progress-box">
                <div class="progress-info">
                    <span>達成度</span>
                    <span id="challengePercent">17.00%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="challengeProgressBar"></div>
                </div>
            </div>
        </div>

        <div class="right-block">
            <div class="counter" id="countDisplay">17002</div>
            <div class="goal-subtext">GOAL: <span>100,000</span></div>
        </div>
    </div>

    <!-- 2. 手元操作用リモコン -->
    <div class="control-panel">
        <div>
            <div class="panel-title">
                <span class="status-dot" id="statusDot"></span>
                <span>SYSTEM CONTROL</span>
            </div>
            <div class="status-bar" id="lastWord">マイク停止中...</div>
        </div>

        <div class="btn-group">
            <button class="btn-toggle" id="toggleBtn">マイク開始 (START)</button>
            <button class="btn-reset" id="resetBtn">リセット</button>
        </div>
    </div>

    <script>
        const countDisplay = document.getElementById('countDisplay');
        const lastWordDisplay = document.getElementById('lastWord');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDot = document.getElementById('statusDot');

        const challengeProgressBar = document.getElementById('challengeProgressBar');
        const challengePercent = document.getElementById('challengePercent');

        // デフォルト初期値を 17002 に設定
        const DEFAULT_COUNT = 17002;
        const GOAL_COUNT = 100000;

        let count = parseInt(localStorage.getItem('ikisugiFastCount'));
        if (isNaN(count)) {
            count = DEFAULT_COUNT;
        }

        function updateChallengeProgress() {
            countDisplay.textContent = count;
            const percent = ((count / GOAL_COUNT) * 100).toFixed(2);
            challengePercent.textContent = percent + '%';
            challengeProgressBar.style.width = Math.min(percent, 100) + '%';
            localStorage.setItem('ikisugiFastCount', count);
        }

        updateChallengeProgress();

        let isListening = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeepSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(1500, now);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.08);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(3000, now + 0.08);
            gain2.gain.setValueAtTime(0.3, now + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.20);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.20);
        }

        function triggerCounterAnimation() {
            countDisplay.classList.remove('bump');
            void countDisplay.offsetWidth;
            countDisplay.classList.add('bump');
            
            setTimeout(() => {
                countDisplay.classList.remove('bump');
            }, 150); 
        }

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

        // ===== 設定 =====
        const CONFIG = {
            lang: 'ja-JP',
            maxAlternatives: 5,          // 認識候補を5つまで見て取りこぼしを減らす
            preferOnDevice: true,        // 端末内認識が使えるなら使う（低遅延・高精度）
            boostPhrases: [['イキスギ', 10], ['いきすぎ', 8], ['行き過ぎ', 4]]
        };

        // ==PURE-START==
        const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
        function normalize(s) {
            return toHira(s.normalize('NFKC').toLowerCase())
                .replace(/[、。,.!?！？・…～~"'「」『』()（）]/g, ' ')
                .replace(/\s+/g, ' ');
        }
        const IKI = '(?:いき|行き|逝き|生き|息|行|逝)';
        const SUGI = '(?:[すず]っ?ぎ|過ぎ|過|杉)';
        const STRICT_SRC = `${IKI}\\s?[っー]?\\s?${SUGI}`;
        // 誤認識されやすい形（先頭に文字が続く「好きすぎ」等は除外）
        const B = '(?<![ぁ-ゟ一-鿿])';
        const LOOSE_SRC = `${B}(?:きすぎ|きすい[いー]|でぃすい[いー])|${B}(?:岐阜|ぎふ)(?![ぁ-ゟ一-鿿])`;
        const STRICT_RE = new RegExp(STRICT_SRC, 'g');
        const ALL_RE = new RegExp(STRICT_SRC + '|' + LOOSE_SRC, 'g');
        function countIn(text, re) { return (normalize(text).match(re) || []).length; }
        // 1つの認識結果について、全候補のうち最大のヒット数を返す（足し算はしない＝二重カウント防止）
        function bestCount(result) {
            let best = 0;
            for (let a = 0; a < result.length; a++) {
                const n = countIn(result[a].transcript, a === 0 ? ALL_RE : STRICT_RE);
                if (n > best) best = n;
            }
            return best;
        }
        // ==PURE-END==

        let recognition = null;
        let ready = null;
        let running = false;
        let restartTimer = null;
        let errorStreak = 0;
        let engineLabel = 'クラウド認識';

        async function setupRecognition() {
            if (!SR) {
                alert("お使いのブラウザは音声認識に対応していません。Google Chrome等をご利用ください。");
                return;
            }
            recognition = new SR();
            recognition.lang = CONFIG.lang;
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = CONFIG.maxAlternatives;

            // 端末内認識 + 「イキスギ」フレーズ強調（対応ブラウザのみ）
            try {
                if (CONFIG.preferOnDevice && 'processLocally' in recognition && typeof SR.available === 'function') {
                    const opt = { langs: [CONFIG.lang], processLocally: true };
                    const status = await SR.available(opt);
                    if (status === 'available') {
                        recognition.processLocally = true;
                        engineLabel = '端末内認識';
                        if (window.SpeechRecognitionPhrase && 'phrases' in recognition) {
                            recognition.phrases = CONFIG.boostPhrases.map(([p, b]) => new SpeechRecognitionPhrase(p, b));
                            engineLabel += '+強調';
                        }
                    } else if ((status === 'downloadable' || status === 'downloading') && typeof SR.install === 'function') {
                        SR.install(opt).catch(() => {}); // 次回起動から端末内認識に切替
                    }
                }
            } catch (e) { console.warn('端末内認識の設定に失敗。クラウド認識を使用:', e); }

            let countedMap = {};

            recognition.onstart = () => { running = true; };

            recognition.onresult = (event) => {
                errorStreak = 0;
                let added = 0, shown = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const n = bestCount(event.results[i]);
                    const prev = countedMap[i] || 0;
                    shown = event.results[i][0].transcript;
                    if (n > prev) { added += n - prev; countedMap[i] = n; }
                }
                if (added > 0) {
                    count += added;
                    updateChallengeProgress();
                    playBeepSound();
                    triggerCounterAnimation();
                    lastWordDisplay.style.color = '#ffea00';
                    lastWordDisplay.textContent = `⚡検知 +${added}: "${shown}"`;
                } else {
                    lastWordDisplay.style.color = '';
                    lastWordDisplay.textContent = `認識中: "${shown}"`;
                }
            };

            recognition.onend = () => {
                running = false;
                countedMap = {};
                if (isListening) {
                    scheduleRestart(errorStreak > 0 ? Math.min(200 * 2 ** errorStreak, 3000) : 0);
                } else {
                    updateUI(false);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech' || event.error === 'aborted') return;
                console.error("音声認識エラー:", event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    alert("マイク許可が必要です。");
                    stopListening();
                } else if (event.error === 'language-not-supported' && recognition.processLocally) {
                    recognition.processLocally = false; // 端末内が使えなければクラウドへ
                    engineLabel = 'クラウド認識';
                } else {
                    errorStreak = Math.min(errorStreak + 1, 5);
                }
            };
        }

        function safeStart() {
            if (!recognition || running) return;
            try { recognition.start(); } catch (e) { /* 既に起動中など */ }
        }

        function scheduleRestart(delay) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => { if (isListening) safeStart(); }, delay);
        }

        // 見張り番: 認識が止まったまま復帰していなければ再起動
        setInterval(() => {
            if (isListening && !running && recognition) scheduleRestart(0);
        }, 3000);

        ready = setupRecognition();

        async function toggleListening() {
            initAudio();
            await ready;
            if (!recognition) return;
            isListening ? stopListening() : startListening();
        }

        function startListening() {
            isListening = true;
            errorStreak = 0;
            safeStart();
            updateUI(true);
        }

        function stopListening() {
            isListening = false;
            clearTimeout(restartTimer);
            try { recognition.stop(); } catch (e) {}
            updateUI(false);
        }

        function updateUI(listening) {
            lastWordDisplay.style.color = '';
            if (listening) {
                toggleBtn.textContent = "マイク停止 (STOP)";
                toggleBtn.classList.add('stop');
                statusDot.classList.add('active');
                lastWordDisplay.textContent = `自動検知システム稼働中 [${engineLabel}]`;
            } else {
                toggleBtn.textContent = "マイク開始 (START)";
                toggleBtn.classList.remove('stop');
                statusDot.classList.remove('active');
                lastWordDisplay.textContent = "マイク停止中";
            }
        }

        resetBtn.addEventListener('click', () => {
            if (confirm("カウントを 17002 にリセットしますか？")) {
                count = DEFAULT_COUNT;
                updateChallengeProgress();
                lastWordDisplay.textContent = "リセット完了 (17002)";
            }
        });

        toggleBtn.addEventListener('click', toggleListening);
    </script>

</body>
</html>
